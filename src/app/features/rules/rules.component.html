    <div class="min-h-screen text-[#1a1a1a] flex flex-col" style="background:#fafaf8">
      <!-- Header -->
      <app-navbar
        [showBack]="true"
        backRoute="/"
        [pageTitle]="i18n.t('nav.rules')"
        [pageSubtitle]="i18n.t('brand.title')" />

      <!-- Content -->
      <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10">
        <div class="mb-10 text-center sm:text-left sm:rtl:text-right">
          <span class="text-xs font-bold uppercase tracking-wider text-cyan-600 block mb-1">
            {{ i18n.t('brand.title') }}
          </span>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
            {{ i18n.t('nav.rules') }}
          </h1>
        </div>

        <div class="space-y-3.5">
          @for (rule of localizedRules(); track rule.number) {
            <div class="glass-card p-5 border border-slate-200 rounded-2xl flex items-start gap-4 hover:border-slate-300 transition-all">
              <div class="w-8 h-8 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 flex items-center justify-center shrink-0 text-xs font-black shadow-2xs">
                {{ rule.number }}
              </div>
              <p class="text-slate-700 leading-relaxed text-sm sm:text-base font-medium">{{ rule.text }}</p>
            </div>
          }
        </div>
      </main>
    </div>
