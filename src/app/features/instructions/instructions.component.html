    <div class="min-h-screen text-[#1a1a1a] flex flex-col" style="background:#fafaf8">
      <!-- Header -->
      <app-navbar
        [showBack]="true"
        backRoute="/"
        [pageTitle]="i18n.t('nav.howToPlay')"
        [pageSubtitle]="i18n.t('brand.title')" />

      <!-- Content -->
      <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10">
        <div class="mb-10 text-center sm:text-left sm:rtl:text-right">
          <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 block mb-1">
            {{ i18n.t('brand.title') }}
          </span>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
            {{ i18n.t('nav.howToPlay') }}
          </h1>
        </div>

        <div class="space-y-4">
          @for (item of localizedInstructions(); track item.title) {
            <div class="glass-card p-6 border border-slate-200 rounded-2xl hover:border-slate-300 transition-all">
              <div class="flex items-start gap-4">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-600 flex items-center justify-center shrink-0 text-xl shadow-xs">
                  <i [class]="item.icon"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-slate-900 mb-1.5">{{ item.title }}</h3>
                  <p class="text-slate-600 text-sm leading-relaxed font-normal">{{ item.description }}</p>
                </div>
              </div>
            </div>
          }
        </div>
      </main>
    </div>
